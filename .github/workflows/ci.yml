name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (Python / Pyright / Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Cache pip-modules
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-modules-${{ runner.os }}-${{ hashFiles('server/requirements.txt', 'server/requirements-dev.txt') }}
          restore-keys: |
            pip-modules-${{ runner.os }}-

      - name: Run Pyright type check
        run: |
          pip install pyright
          pyright

      - name: Run pytest
        run: |
          pip install pytest
          pytest

  client:
    name: Client (Node / TypeScript / Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check (--noEmit)
        run: npx tsc --noEmit

      - name: Run vitest
        run: npx vitest run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Start fixture server (background)
        run: |
          # Start the backend fixture server on port 8000
          python -m pip install --upgrade pip
          python -m pip install -r ../server/requirements.txt
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          echo "Fixture server running on port 8000"

      - name: Run playwright tests (headed on failure)
        env:
          HEADLESS: "false"
        run: |
          npx playwright test --headed || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30